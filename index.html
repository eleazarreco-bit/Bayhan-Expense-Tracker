<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bayhan Wireless Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#123A5C;
    --navy-deep:#0B283F;
    --blue:#2E86AB;
    --blue-light:#5FA8CE;
    --sky:#EFF6FB;
    --green:#2FA876;
    --green-dark:#1F7A57;
    --green-tint:#E3F6ED;
    --yellow:#F5B942;
    --yellow-dark:#B8790F;
    --yellow-tint:#FFF4DD;
    --ink:#152A3D;
    --muted:#5B7286;
    --line:#DCE6EE;
    --white:#FFFFFF;
    --shadow: 0 1px 2px rgba(11,40,63,0.06), 0 10px 28px rgba(11,40,63,0.07);
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(1200px 500px at 100% -10%, rgba(46,134,171,0.10), transparent),
      radial-gradient(900px 400px at -5% 0%, rgba(245,185,66,0.12), transparent),
      var(--sky);
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:'Space Grotesk', 'Inter', sans-serif; }

  /* ---------- Header ---------- */
  .topbar{
    background: linear-gradient(120deg, var(--navy-deep) 0%, var(--navy) 55%, var(--blue) 130%);
    color:#fff;
    padding:28px clamp(18px,4vw,48px) 34px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 34px);
    pointer-events:none;
  }
  .topbar-inner{
    position:relative;
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
    max-width:1240px; margin:0 auto;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-mark{
    width:46px; height:46px; border-radius:12px;
    background: linear-gradient(160deg, var(--yellow), var(--green));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    flex-shrink:0;
  }
  .brand h1{ margin:0; font-size:22px; font-weight:700; letter-spacing:0.2px; }
  .brand p{ margin:2px 0 0; font-size:13px; color:#BFD9EA; }
  .add-btn{
    background: var(--yellow);
    color:#3A2600;
    border:none;
    padding:12px 20px;
    border-radius:12px;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    display:flex; align-items:center; gap:8px;
    box-shadow: 0 6px 16px rgba(245,185,66,0.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .add-btn:hover{ transform:translateY(-1px); box-shadow:0 9px 20px rgba(245,185,66,0.45); }
  .add-btn:active{ transform:translateY(0); }

  .wrap{ max-width:1240px; margin:0 auto; padding:0 clamp(18px,4vw,48px) 60px; }

  /* ---------- Stats ---------- */
  .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-top:-40px;
    position:relative;
    z-index:2;
  }
  .stat-card{
    background:var(--white);
    border-radius:var(--radius);
    padding:18px 20px;
    box-shadow:var(--shadow);
    border-top:4px solid var(--blue);
  }
  .stat-card.green{ border-top-color:var(--green); }
  .stat-card.yellow{ border-top-color:var(--yellow); }
  .stat-card.navy{ border-top-color:var(--navy); }
  .stat-label{ font-size:12.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.4px; }
  .stat-value{ font-size:26px; font-weight:700; margin-top:6px; font-family:'Space Grotesk',sans-serif; color:var(--navy-deep); }
  .stat-sub{ font-size:12.5px; color:var(--muted); margin-top:4px; }

  /* ---------- Filter bar ---------- */
  .filters{
    background:var(--white);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px 20px;
    margin-top:24px;
    display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;
  }
  .field{ display:flex; flex-direction:column; gap:6px; min-width:130px; flex:1; }
  .field label{ font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.35px; }
  select, input{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:10px 12px;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  select:focus, input:focus{ border-color:var(--blue); }
  .amount-range{ display:flex; gap:8px; }
  .amount-range input{ width:100%; }
  .clear-btn{
    background:transparent;
    border:1.5px solid var(--line);
    color:var(--muted);
    padding:10px 16px;
    border-radius:9px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    white-space:nowrap;
  }
  .clear-btn:hover{ border-color:var(--blue); color:var(--blue); }

  /* ---------- Receipts ---------- */
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin:30px 0 14px;
  }
  .section-head h2{ font-size:19px; margin:0; color:var(--navy-deep); }
  .count-pill{ font-size:12.5px; color:var(--muted); font-weight:500; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
    gap:16px;
  }
  .card{
    background:var(--white);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex; flex-direction:column;
    border:1px solid var(--line);
  }
  .card-thumb{
    height:130px;
    background:var(--sky);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .card-thumb img{ width:100%; height:100%; object-fit:cover; }
  .card-thumb .filebadge{
    color:var(--blue);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    font-size:12px; font-weight:600;
  }
  .card-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .badge{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; letter-spacing:0.3px;
  }
  .badge.bayhan{ background:var(--sky); color:var(--blue); border:1px solid var(--blue-light); }
  .badge.karla{ background:var(--green-tint); color:var(--green-dark); border:1px solid var(--green); }
  .card-date{ font-size:12.5px; color:var(--muted); font-weight:500; }
  .card-store{ font-size:16px; font-weight:700; color:var(--navy-deep); font-family:'Space Grotesk',sans-serif; }
  .card-type{ font-size:12.5px; color:var(--muted); }
  .card-type span{ background:var(--yellow-tint); color:var(--yellow-dark); padding:2px 8px; border-radius:6px; font-weight:600; }
  .card-amount{ font-size:20px; font-weight:700; color:var(--green-dark); font-family:'Space Grotesk',sans-serif; margin-top:2px; }
  .card-actions{ display:flex; gap:8px; margin-top:auto; padding-top:10px; }
  .icon-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 10px; border-radius:9px; border:1.5px solid var(--line);
    background:#fff; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--navy);
  }
  .icon-btn:hover{ border-color:var(--blue); color:var(--blue); }
  .icon-btn.danger:hover{ border-color:#D24C4C; color:#D24C4C; }

  .empty{
    text-align:center; padding:60px 20px; color:var(--muted);
    background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow);
  }
  .empty h3{ color:var(--navy-deep); margin-bottom:6px; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(11,40,63,0.55);
    display:flex; align-items:center; justify-content:center; z-index:50;
    padding:20px; backdrop-filter:blur(2px);
  }
  .hidden{ display:none !important; }
  .modal{
    background:#fff; border-radius:18px; width:100%; max-width:520px;
    max-height:90vh; overflow-y:auto;
    box-shadow:0 24px 60px rgba(11,40,63,0.35);
  }
  .modal-head{
    padding:20px 24px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .modal-head h2{ margin:0; font-size:18px; color:var(--navy-deep); }
  .modal-close{ background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted); }
  .modal-body{ padding:22px 24px; display:flex; flex-direction:column; gap:16px; }
  .form-row{ display:flex; gap:14px; }
  .form-row .field{ flex:1; }
  .dropzone{
    border:2px dashed var(--blue-light);
    border-radius:12px;
    padding:22px;
    text-align:center;
    cursor:pointer;
    background:var(--sky);
    transition: border-color .15s ease, background .15s ease;
  }
  .dropzone.drag{ border-color:var(--green); background:var(--green-tint); }
  .dropzone p{ margin:6px 0 0; font-size:13px; color:var(--muted); }
  .dropzone strong{ color:var(--blue); }
  .preview-row{ display:flex; align-items:center; gap:12px; }
  .preview-row img{ width:60px; height:60px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .preview-name{ font-size:13px; color:var(--ink); font-weight:600; word-break:break-all; }
  .remove-file{ font-size:12px; color:#D24C4C; background:none; border:none; cursor:pointer; font-weight:600; }
  .modal-foot{ padding:16px 24px 22px; display:flex; gap:12px; justify-content:flex-end; }
  .btn-primary{
    background: linear-gradient(120deg, var(--green), var(--blue));
    color:#fff; border:none; padding:11px 22px; border-radius:10px;
    font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-ghost{
    background:none; border:1.5px solid var(--line); color:var(--muted);
    padding:11px 20px; border-radius:10px; font-weight:600; font-size:14px; cursor:pointer;
  }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--navy-deep); color:#fff; padding:12px 20px; border-radius:10px;
    font-size:13.5px; font-weight:500; box-shadow:0 10px 30px rgba(0,0,0,0.3);
    z-index:100; display:flex; align-items:center; gap:8px;
  }
  .required-star{ color:#D24C4C; }
  .loading-note{ font-size:12.5px; color:var(--muted); text-align:center; padding:20px; }

  @media(max-width:760px){
    .stats{ grid-template-columns:repeat(2,1fr); }
    .form-row{ flex-direction:column; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 20c-3.5 0-6.6-1.4-9-3.7" stroke="#0B283F" stroke-width="2" stroke-linecap="round"/>
          <path d="M4.5 12.8C6.8 10.7 9.3 9.6 12 9.6s5.2 1.1 7.5 3.2" stroke="#0B283F" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 9.3C9.2 8.3 10.5 7.8 12 7.8s2.8.5 4 1.5" stroke="#0B283F" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
          <circle cx="12" cy="17" r="1.6" fill="#0B283F"/>
        </svg>
      </div>
      <div>
        <h1>Bayhan Wireless Expense Tracker</h1>
      </div>
    </div>
    <button class="add-btn" id="openAddBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#3A2600" stroke-width="2.5" stroke-linecap="round"/></svg>
      Add receipt
    </button>
  </div>
</div>

<div class="wrap">

  <div class="stats" id="statsRow"></div>

  <div class="filters">
    <div class="field">
      <label for="fMarket">Market</label>
      <select id="fMarket">
        <option value="">All markets</option>
        <option value="Bayhan">Bayhan</option>
        <option value="Karla">Karla</option>
      </select>
    </div>
    <div class="field">
      <label for="fMonth">Month</label>
      <select id="fMonth"><option value="">All months</option></select>
    </div>
    <div class="field">
      <label for="fDate">Specific date</label>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <label for="fType">Expense type</label>
      <select id="fType"><option value="">All types</option></select>
    </div>
    <div class="field">
      <label>Amount range</label>
      <div class="amount-range">
        <input type="number" id="fMin" placeholder="Min" min="0" step="0.01">
        <input type="number" id="fMax" placeholder="Max" min="0" step="0.01">
      </div>
    </div>
    <button class="clear-btn" id="clearFilters">Clear filters</button>
  </div>

  <div class="section-head">
    <h2>Receipts</h2>
    <span class="count-pill" id="countPill"></span>
  </div>

  <div id="gridArea"><div class="loading-note">Loading receipts…</div></div>
</div>

<!-- Add Receipt Modal -->
<div class="overlay hidden" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2>Add receipt</h2>
      <button class="modal-close" id="closeModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="field">
          <label>Date <span class="required-star">*</span></label>
          <input type="date" id="inDate">
        </div>
        <div class="field">
          <label>Market <span class="required-star">*</span></label>
          <select id="inMarket">
            <option value="">Select market</option>
            <option value="Bayhan">Bayhan</option>
            <option value="Karla">Karla</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Store name <span class="required-star">*</span></label>
          <input type="text" id="inStore" placeholder="e.g. Metro Supply Co.">
        </div>
        <div class="field">
          <label>Amount <span class="required-star">*</span></label>
          <input type="number" id="inAmount" min="0" step="0.01" placeholder="0.00">
        </div>
      </div>
      <div class="field">
        <label>Expense type <span class="required-star">*</span></label>
        <select id="inType">
          <option value="">Select type</option>
          <option>Inventory & Stock</option>
          <option>Rent</option>
          <option>Utilities</option>
          <option>Maintenance & Repairs</option>
          <option>Supplies</option>
          <option>Marketing</option>
          <option>Payroll</option>
          <option>Transportation</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label>Receipt file</label>
        <div class="dropzone" id="dropzone">
          <div id="dzDefault">
            <div style="font-size:26px;">📎</div>
            <p><strong>Click to upload</strong> or drag a receipt here</p>
            <p style="font-size:11.5px;">Images or PDF</p>
          </div>
          <div id="dzPreview" class="hidden preview-row">
            <img id="previewImg" class="hidden">
            <div id="previewFileIcon" class="hidden" style="font-size:30px;">📄</div>
            <div style="flex:1; text-align:left;">
              <div class="preview-name" id="previewName"></div>
              <button class="remove-file" id="removeFile">Remove file</button>
            </div>
          </div>
        </div>
        <input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn">Save receipt</button>
    </div>
  </div>
</div>

<script>
(function(){
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  let receipts = []; // metadata list
  let pendingFile = null; // {dataUrl, name, type}

  const gridArea = document.getElementById('gridArea');
  const statsRow = document.getElementById('statsRow');
  const countPill = document.getElementById('countPill');

  function showToast(msg){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=> t.remove(), 2600);
  }

  function fmtMoney(n){
    return '$' + Number(n).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function monthKey(dateStr){
    if(!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function monthLabel(key){
    const [y,m] = key.split('-');
    return MONTHS[parseInt(m,10)-1] + ' ' + y;
  }

  async function loadReceipts(){
    try{
      const res = await window.storage.get('receipts-meta', false);
      receipts = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      receipts = [];
    }
    render();
  }

  async function saveReceiptsList(){
    try{
      await window.storage.set('receipts-meta', JSON.stringify(receipts), false);
    }catch(e){
      showToast('Could not save — please try again.');
    }
  }

  function populateFilterOptions(){
    const monthSel = document.getElementById('fMonth');
    const typeSel = document.getElementById('fType');
    const existingMonth = monthSel.value;
    const existingType = typeSel.value;

    const months = Array.from(new Set(receipts.map(r=>monthKey(r.date)).filter(Boolean))).sort().reverse();
    monthSel.innerHTML = '<option value="">All months</option>' + months.map(m=>`<option value="${m}">${monthLabel(m)}</option>`).join('');
    monthSel.value = months.includes(existingMonth) ? existingMonth : '';

    const types = Array.from(new Set(receipts.map(r=>r.expenseType).filter(Boolean))).sort();
    typeSel.innerHTML = '<option value="">All types</option>' + types.map(t=>`<option value="${t}">${t}</option>`).join('');
    typeSel.value = types.includes(existingType) ? existingType : '';
  }

  function getFiltered(){
    const market = document.getElementById('fMarket').value;
    const month = document.getElementById('fMonth').value;
    const date = document.getElementById('fDate').value;
    const type = document.getElementById('fType').value;
    const min = document.getElementById('fMin').value;
    const max = document.getElementById('fMax').value;

    return receipts.filter(r=>{
      if(market && r.market !== market) return false;
      if(month && monthKey(r.date) !== month) return false;
      if(date && r.date !== date) return false;
      if(type && r.expenseType !== type) return false;
      if(min !== '' && Number(r.amount) < Number(min)) return false;
      if(max !== '' && Number(r.amount) > Number(max)) return false;
      return true;
    }).sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  }

  function renderStats(){
    const total = receipts.reduce((s,r)=>s+Number(r.amount||0),0);
    const bayhan = receipts.filter(r=>r.market==='Bayhan').reduce((s,r)=>s+Number(r.amount||0),0);
    const karla = receipts.filter(r=>r.market==='Karla').reduce((s,r)=>s+Number(r.amount||0),0);
    const now = new Date();
    const curKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
    const thisMonth = receipts.filter(r=>monthKey(r.date)===curKey).reduce((s,r)=>s+Number(r.amount||0),0);

    statsRow.innerHTML = `
      <div class="stat-card navy">
        <div class="stat-label">Total expenses</div>
        <div class="stat-value">${fmtMoney(total)}</div>
        <div class="stat-sub">${receipts.length} receipt${receipts.length===1?'':'s'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Bayhan</div>
        <div class="stat-value">${fmtMoney(bayhan)}</div>
        <div class="stat-sub">${receipts.filter(r=>r.market==='Bayhan').length} receipts</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">Karla</div>
        <div class="stat-value">${fmtMoney(karla)}</div>
        <div class="stat-sub">${receipts.filter(r=>r.market==='Karla').length} receipts</div>
      </div>
      <div class="stat-card yellow">
        <div class="stat-label">This month</div>
        <div class="stat-value">${fmtMoney(thisMonth)}</div>
        <div class="stat-sub">${MONTHS[now.getMonth()]} ${now.getFullYear()}</div>
      </div>
    `;
  }

  function cardHtml(r){
    const isImg = r.fileType && r.fileType.startsWith('image/');
    const badgeClass = r.market === 'Karla' ? 'karla' : 'bayhan';
    const thumb = r.hasFile
      ? (isImg
          ? `<img class="lazy-thumb" data-id="${r.id}" alt="receipt">`
          : `<div class="filebadge"><span style="font-size:30px;">📄</span>PDF receipt</div>`)
      : `<div class="filebadge" style="color:var(--muted);"><span style="font-size:26px;">🧾</span>No file attached</div>`;

    return `
      <div class="card" data-id="${r.id}">
        <div class="card-thumb">${thumb}</div>
        <div class="card-body">
          <div class="card-top">
            <span class="badge ${badgeClass}">${r.market}</span>
            <span class="card-date">${r.date || '—'}</span>
          </div>
          <div class="card-store">${escapeHtml(r.store)}</div>
          <div class="card-type"><span>${escapeHtml(r.expenseType)}</span></div>
          <div class="card-amount">${fmtMoney(r.amount)}</div>
          <div class="card-actions">
            ${r.hasFile ? `<button class="icon-btn download-btn" data-id="${r.id}">⬇ Download</button>` : `<span class="icon-btn" style="opacity:.4; cursor:default;">No file</span>`}
            <button class="icon-btn danger delete-btn" data-id="${r.id}">🗑 Delete</button>
          </div>
        </div>
      </div>
    `;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(){
    populateFilterOptions();
    renderStats();
    const filtered = getFiltered();
    countPill.textContent = `${filtered.length} of ${receipts.length} shown`;
    if(filtered.length === 0){
      gridArea.innerHTML = `
        <div class="empty">
          <h3>${receipts.length===0 ? 'No receipts yet' : 'No receipts match these filters'}</h3>
          <p>${receipts.length===0 ? 'Add your first receipt to start tracking expenses.' : 'Try clearing a filter to see more results.'}</p>
        </div>`;
      return;
    }
    gridArea.innerHTML = `<div class="grid">${filtered.map(cardHtml).join('')}</div>`;

    gridArea.querySelectorAll('.delete-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> deleteReceipt(btn.dataset.id));
    });
    gridArea.querySelectorAll('.download-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> downloadReceipt(btn.dataset.id));
    });
    gridArea.querySelectorAll('.lazy-thumb').forEach(img=>{
      loadThumb(img.dataset.id, img);
    });
  }

  async function loadThumb(id, imgEl){
    try{
      const res = await window.storage.get('receipt-file:' + id, false);
      if(res && res.value) imgEl.src = res.value;
    }catch(e){ /* leave blank on failure */ }
  }

  async function deleteReceipt(id){
    if(!confirm('Delete this receipt? This cannot be undone.')) return;
    receipts = receipts.filter(r=>r.id !== id);
    await saveReceiptsList();
    try{ await window.storage.delete('receipt-file:' + id, false); }catch(e){}
    render();
    showToast('Receipt deleted.');
  }

  async function downloadReceipt(id){
    const r = receipts.find(x=>x.id===id);
    if(!r) return;
    try{
      const res = await window.storage.get('receipt-file:' + id, false);
      if(!res || !res.value){ showToast('File not found.'); return; }
      const a = document.createElement('a');
      a.href = res.value;
      a.download = r.fileName || ('receipt-' + id);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }catch(e){
      showToast('Could not retrieve file.');
    }
  }

  // ---------- Filters wiring ----------
  ['fMarket','fMonth','fDate','fType','fMin','fMax'].forEach(id=>{
    document.getElementById(id).addEventListener('input', render);
    document.getElementById(id).addEventListener('change', render);
  });
  document.getElementById('clearFilters').addEventListener('click', ()=>{
    ['fMarket','fMonth','fDate','fType','fMin','fMax'].forEach(id=> document.getElementById(id).value='');
    render();
  });

  // ---------- Modal ----------
  const overlay = document.getElementById('overlay');
  function openModal(){
    overlay.classList.remove('hidden');
    document.getElementById('inDate').value = new Date().toISOString().slice(0,10);
  }
  function closeModal(){
    overlay.classList.add('hidden');
    ['inDate','inMarket','inStore','inAmount','inType'].forEach(id=> document.getElementById(id).value='');
    pendingFile = null;
    document.getElementById('dzDefault').classList.remove('hidden');
    document.getElementById('dzPreview').classList.add('hidden');
    document.getElementById('previewImg').classList.add('hidden');
    document.getElementById('previewFileIcon').classList.add('hidden');
    document.getElementById('fileInput').value = '';
  }
  document.getElementById('openAddBtn').addEventListener('click', openModal);
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });

  // ---------- File upload ----------
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  dropzone.addEventListener('click', ()=> fileInput.click());
  dropzone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', ()=> dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', (e)=>{
    e.preventDefault(); dropzone.classList.remove('drag');
    if(e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', ()=>{
    if(fileInput.files && fileInput.files[0]) handleFile(fileInput.files[0]);
  });
  document.getElementById('removeFile').addEventListener('click', (e)=>{
    e.stopPropagation();
    pendingFile = null;
    document.getElementById('dzDefault').classList.remove('hidden');
    document.getElementById('dzPreview').classList.add('hidden');
    fileInput.value = '';
  });

  function handleFile(file){
    if(file.size > 4.5*1024*1024){
      showToast('File too large — please use a file under 4.5MB.');
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      pendingFile = { dataUrl: reader.result, name: file.name, type: file.type };
      document.getElementById('dzDefault').classList.add('hidden');
      document.getElementById('dzPreview').classList.remove('hidden');
      document.getElementById('previewName').textContent = file.name;
      if(file.type.startsWith('image/')){
        document.getElementById('previewImg').src = reader.result;
        document.getElementById('previewImg').classList.remove('hidden');
        document.getElementById('previewFileIcon').classList.add('hidden');
      } else {
        document.getElementById('previewImg').classList.add('hidden');
        document.getElementById('previewFileIcon').classList.remove('hidden');
      }
    };
    reader.readAsDataURL(file);
  }

  // ---------- Save receipt ----------
  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const date = document.getElementById('inDate').value;
    const market = document.getElementById('inMarket').value;
    const store = document.getElementById('inStore').value.trim();
    const amount = document.getElementById('inAmount').value;
    const expenseType = document.getElementById('inType').value;

    if(!date || !market || !store || !amount || !expenseType){
      showToast('Please fill in all required fields.');
      return;
    }

    const id = 'r' + Date.now() + Math.random().toString(36).slice(2,7);
    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    const meta = {
      id, date, market, store, expenseType,
      amount: Number(amount),
      hasFile: !!pendingFile,
      fileName: pendingFile ? pendingFile.name : '',
      fileType: pendingFile ? pendingFile.type : '',
      createdAt: new Date().toISOString()
    };

    try{
      if(pendingFile){
        await window.storage.set('receipt-file:' + id, pendingFile.dataUrl, false);
      }
      receipts.push(meta);
      await saveReceiptsList();
      render();
      closeModal();
      showToast('Receipt saved.');
    }catch(e){
      showToast('Something went wrong while saving.');
    }finally{
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save receipt';
    }
  });

  loadReceipts();
})();
</script>
</body>
</html>
